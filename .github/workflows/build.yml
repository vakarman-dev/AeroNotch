name: Build AeroNotch EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name AeroNotch main.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroNotch-Windows
          path: dist/AeroNotch.exe
